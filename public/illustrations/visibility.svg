<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" role="img" aria-label="Audience reach chart">
  <defs>
    <linearGradient id="vis-line" x1="100" y1="90" x2="520" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7B8"/>
      <stop offset="0.45" stop-color="#FF8C1A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="vis-area" x1="240" y1="230" x2="240" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6A00" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vis-panel" x1="80" y1="40" x2="560" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181820"/>
      <stop offset="1" stop-color="#09090E"/>
    </linearGradient>
    <radialGradient id="vis-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 270) scale(240)">
      <stop stop-color="#FF6A00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="vis-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#FF6A00" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="320" cy="270" r="220" fill="url(#vis-halo)"/>
  <ellipse cx="320" cy="518" rx="160" ry="14" fill="#000" opacity="0.4"/>

  <g filter="url(#vis-shadow)">
